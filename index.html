<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pseudo practical | اختبار تشريح عملي</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1f4;--card:#fff;--line:#d9d4de;--tx:#17142a;--mu:#5d5873;--acc:#c2185b;--acc2:#7a1fa2;--cover:#12183a;--covertx:#fff;--ok:#0f9d6e;--bad:#d6264a;--glow:#ff2d6f;--ring:#fff;color-scheme:light}
:root[data-theme=dark]{--bg:#0b0e1d;--card:#141a36;--line:#2a3262;--tx:#eef1ff;--mu:#a3acd6;--acc:#ff4f8a;--acc2:#a96bff;--cover:#0a0f2b;--ok:#2fe0ae;--bad:#ff6b86;--glow:#ff2d6f;--ring:#fff;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.6 Cairo,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:1500px;margin:auto;padding:14px}
header{display:flex;align-items:center;gap:12px;padding:8px 0 14px}
header img{width:46px;height:46px;border-radius:50%}
header h1{font-size:1.25rem;font-weight:800;flex:1}
button,input{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 16px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card h3{font-size:1.05rem}.card .ar{color:var(--mu)}.card .meta{color:var(--mu);font-size:.9rem}
.card .row{display:flex;gap:8px;margin-top:auto;padding-top:10px}.card .row button{flex:1}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}.seg button[aria-pressed=true]{background:var(--acc2);color:#fff}
.stage{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media(min-width:900px){.stage{grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr)}}
.imgbox{position:relative;container-type:inline-size;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;line-height:0;margin-inline:auto;width:100%}
@media(min-width:900px){.imgbox{max-width:calc((100dvh - 150px) * var(--ar,.7))}}
.imgbox img{width:100%;height:auto;display:block}
.pin{position:absolute;background:var(--cover);color:var(--covertx);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:2.4cqw;line-height:1;border-radius:.6cqw;border:0;padding:0;min-width:0;min-height:0;overflow:hidden}
.mask{position:absolute;background:var(--cover);pointer-events:none}
.pin.target{background:var(--cover);z-index:3;box-shadow:0 0 0 .5cqw var(--ring),0 0 0 .9cqw var(--glow),0 0 3cqw 1.6cqw var(--glow);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 .5cqw var(--ring),0 0 0 .9cqw var(--glow),0 0 4.5cqw 2.4cqw var(--glow)}}
@media(prefers-reduced-motion:reduce){.pin.target{animation:none}}
.pin.open{background:var(--card);color:var(--tx);box-shadow:0 0 0 .3cqw var(--acc);font-size:1.9cqw;font-weight:600;white-space:nowrap;direction:ltr}
.study .pin{cursor:pointer;min-width:3.4cqw}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.q{font-size:1.1rem;font-weight:600}
.opts{display:grid;gap:8px}
.opt{text-align:start;direction:ltr;min-height:48px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
input[type=text]{direction:ltr;width:100%;min-height:48px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.fb{min-height:1.6em;font-weight:600}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0}
.score{font-size:2.4rem;font-weight:800}
.hide{display:none!important}
.note{color:var(--mu);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
<header><img src="images/logo.webp" alt="" width="46" height="46"><h1>Pseudo practical</h1>
<button id="theme" aria-label="تبديل الثيم">🌓</button></header>
<main id="app"></main>
</div>
<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s), app=$('#app');
let DATA=[], S=null;
/* ---------- theme ---------- */
(function(){let t=null;try{t=localStorage.getItem('pp-theme')}catch(e){}
 if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
 document.documentElement.dataset.theme=t;
 $('#theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('pp-theme',n)}catch(e){}};})();
/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/\b(the|a|an)\b/g,' ').replace(/[^a-z0-9]+/g,'').trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const forms=p=>[p.name,...(p.alt||[])].map(norm).filter(Boolean);
function judge(p,txt){const u=norm(txt);if(!u)return 0;let best=9;
 for(const f of forms(p)){if(u===f)return 1;best=Math.min(best,lev(u,f));}
 const L=forms(p)[0].length;return best<=(L>=9?2:L>=5?1:0)?2:0}  // 1 exact, 2 minor typo, 0 wrong
const count=d=>d.pages.reduce((n,p)=>n+p.pins.length,0);
function pinsHTML(page,mode,targetN,openAll,openSet){
 const m=mode==='study'?'':(page.masks||[]).map(k=>`<i class="mask" style="left:${k.x}%;top:${k.y}%;width:${k.w}%;height:${k.h}%"></i>`).join('');
 return m+page.pins.map(p=>{const t=p.n===targetN,o=openAll||(openSet&&openSet.has(p.n));
  return `<button type="button" class="pin ${t?'target':'dim'} ${o?'open':''}" data-n="${p.n}" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%" aria-label="${o?esc(p.name):'pin '+p.n}">${o?`<span class="en">${esc(p.name)}</span>`:p.n}</button>`}).join('')}
function imgHTML(page,extra,mode,targetN,openAll,openSet){
 return `<div class="imgbox ${mode==='study'?'study':''}" id="ib" style="--ar:${page.ar||.7}">
  <img src="${page.img}" alt="صورة المجسم" loading="lazy" decoding="async" onload="this.parentNode.style.setProperty('--ar',this.naturalWidth/this.naturalHeight)">${pinsHTML(page,mode,targetN,openAll,openSet)}</div>`}
/* ---------- home ---------- */
function home(){S=null;
 app.innerHTML=`<p class="note" style="margin-bottom:12px">اختر مجسمًا ثم اختبر نفسك أو ذاكر. الأسماء مأخوذة حرفيًا من ملف المجسمات.</p><div class="grid">`+DATA.map(d=>{
  const n=count(d),dis=n===0;return `<article class="card"><h3 class="en">${esc(d.en)}</h3><div class="ar">${esc(d.ar)}</div>
  <div class="meta">${d.pages.length} صور · ${n} سؤال${dis?' — لا توجد صور بعد':''}</div>
  <div class="row"><button class="pri" data-quiz="${d.id}" ${dis?'disabled':''}>اختبار</button><button data-study="${d.id}" ${dis?'disabled':''}>مذاكرة</button></div></article>`}).join('')+`</div>`;
 app.onclick=e=>{const q=e.target.closest('[data-quiz]'),s=e.target.closest('[data-study]');if(q)startQuiz(q.dataset.quiz);if(s)startStudy(s.dataset.study)}}
/* ---------- quiz ---------- */
function startQuiz(id,list,mode){const d=DATA.find(x=>x.id===id);
 const all=list||shuffle(d.pages.flatMap((pg,pi)=>pg.pins.map(pin=>({pi,n:pin.n}))));
 S={t:'quiz',d,mode:mode||(S&&S.mode)||'mcq',q:all,i:0,wrong:[],right:0,done:false,list:all};renderQ()}
function pinOf(it){const pg=S.d.pages[it.pi];return{pg,pin:pg.pins.find(p=>p.n===it.n)}}
function options(pin){const me=norm(pin.name),mine=new Set(forms(pin));const seen=new Set([me]),pool=[];
 for(const pg of S.d.pages)for(const p of pg.pins){const k=norm(p.name);if(seen.has(k)||forms(p).some(f=>mine.has(f)))continue;seen.add(k);pool.push(p.name)}
 return shuffle([pin.name,...shuffle(pool).slice(0,3)])}
function renderQ(){const it=S.q[S.i];if(!it)return results();const{pg,pin}=pinOf(it);S.cur={pin,opts:S.mode==='mcq'?options(pin):null,ans:false};
 app.innerHTML=`<div class="bar"><button id="back">← المجسمات</button><span class="en" style="font-weight:800">${esc(S.d.en)}</span><span class="sp"></span>
  <div class="seg" role="group" aria-label="نمط الإجابة"><button data-m="mcq" aria-pressed="${S.mode==='mcq'}">اختيارات</button><button data-m="type" aria-pressed="${S.mode==='type'}">كتابة</button></div></div>
  <div class="prog"><i style="width:${S.i/S.q.length*100}%"></i></div><p class="note" style="margin:6px 0 10px">سؤال ${S.i+1} من ${S.q.length}</p>
  <div class="stage">${imgHTML(pg,'', 'quiz',pin.n)}
  <section class="panel"><div class="q">ما اسم التركيب المضيء (رقم <span class="en">${pin.n}</span>)؟</div>
  ${S.mode==='mcq'?`<div class="opts">${S.cur.opts.map((o,k)=>`<button class="opt" data-o="${k}">${esc(o)}</button>`).join('')}</div>`
  :`<input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="اكتب الاسم بالإنجليزية" aria-label="الإجابة"><button class="pri" id="chk">تحقق</button>`}
  <div class="fb" id="fb" aria-live="polite"></div><button class="pri hide" id="next">التالي</button></section></div>`;
 $('#back').onclick=home;
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;renderQ()});
 if(S.mode==='mcq')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(S.cur.opts[b.dataset.o],b));
 else{$('#chk').onclick=()=>answer($('#ans').value);$('#ans').focus({preventScroll:true})}
 $('#next').onclick=()=>{S.i++;renderQ()}}
function answer(txt,btn){if(S.cur.ans)return;const p=S.cur.pin,r=judge(p,txt);if(S.mode==='type'&&!norm(txt))return;S.cur.ans=true;
 const fb=$('#fb');S.cur.r=r;
 if(r){S.right++;fb.className='fb ok';fb.innerHTML=(r===2?'صحيحة مع خطأ إملائي بسيط — الصحيح: ':'صحيح ✓ ')+`<span class="en">${esc(p.name)}</span>`}
 else{S.wrong.push(S.q[S.i]);fb.className='fb bad';fb.innerHTML=`خطأ ✗ — الصحيح: <span class="en">${esc(p.name)}</span>`}
 if(S.mode==='mcq')app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(norm(S.cur.opts[b.dataset.o])===norm(p.name))b.classList.add('ok');else if(b===btn)b.classList.add('bad')});
 else{$('#ans').readOnly=true;$('#chk').classList.add('hide')}
 const tg=$('.pin.target');if(tg){tg.classList.add('open');tg.innerHTML=`<span class="en">${esc(p.name)}</span>`}
 const nx=$('#next');nx.classList.remove('hide');nx.textContent=S.i+1<S.q.length?'التالي':'النتيجة';nx.focus()}
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!S||S.t!=='quiz'||S.done)return;
 if(S.cur&&S.cur.ans){if(document.activeElement!==$('#next'))$('#next').click()}else if(S.mode==='type'&&document.activeElement===$('#ans')){e.preventDefault();answer($('#ans').value)}});
function results(){S.done=true;const n=S.q.length,pc=Math.round(S.right/n*100);
 app.innerHTML=`<div class="panel" style="max-width:560px;margin:20px auto;text-align:center"><div class="score">${S.right} / ${n}</div><div style="font-size:1.4rem;font-weight:600">${pc}%</div>
  <button class="pri" id="again">إعادة الكل</button><button id="redo" ${S.wrong.length?'':'disabled'}>إعادة الأخطاء (${S.wrong.length})</button>
  <button id="rev" ${S.wrong.length?'':'disabled'}>مراجعة الأخطاء بالصورة</button><button id="h">المجسمات</button></div>`;
 $('#again').onclick=()=>startQuiz(S.d.id,null,S.mode);$('#redo').onclick=()=>startQuiz(S.d.id,shuffle(S.wrong),S.mode);
 $('#rev').onclick=()=>review(0);$('#h').onclick=home}
function review(k){const w=S.wrong,it=w[k],{pg,pin}=pinOf(it);
 app.innerHTML=`<div class="bar"><button id="r0">← النتيجة</button><span class="sp"></span><span class="note">${k+1} / ${w.length}</span></div>
  <div class="stage">${imgHTML(pg,'','quiz',pin.n)}<section class="panel"><div class="q">الإجابة الصحيحة (رقم <span class="en">${pin.n}</span>)</div>
  <div class="score en" style="font-size:1.6rem">${esc(pin.name)}</div>${pin.alt&&pin.alt.length?`<div class="note">مرادفات: <span class="en">${esc(pin.alt.join(' / '))}</span></div>`:''}
  <div class="bar"><button id="rp" ${k?'':'disabled'}>السابق</button><button class="pri" id="rn" ${k+1<w.length?'':'disabled'}>التالي</button></div></section></div>`;
 const t=$('.pin.target');t.classList.add('open');t.innerHTML=`<span class="en">${esc(pin.name)}</span>`;
 $('#r0').onclick=results;$('#rp').onclick=()=>review(k-1);$('#rn').onclick=()=>review(k+1)}
/* ---------- study ---------- */
function startStudy(id){const d=DATA.find(x=>x.id===id);S={t:'study',d,pi:0,all:false,open:new Set()};renderS()}
function renderS(){const d=S.d,pg=d.pages[S.pi];
 app.innerHTML=`<div class="bar"><button id="back">← المجسمات</button><span class="en" style="font-weight:800">${esc(d.en)}</span><span class="sp"></span>
  <button id="tg" aria-pressed="${S.all}">${S.all?'إخفاء الكل':'إظهار الكل'}</button></div>
  <div class="stage">${imgHTML(pg,'','study',0,S.all,S.open)}<section class="panel"><div class="q">اضغط على أي رقم لإظهار اسمه</div>
  <div class="note">صورة ${S.pi+1} من ${d.pages.length} — ${pg.pins.length} تراكيب</div>
  <div class="bar"><button id="sp" ${S.pi?'':'disabled'}>السابقة</button><button class="pri" id="sn" ${S.pi+1<d.pages.length?'':'disabled'}>التالية</button></div></section></div>`;
 $('#back').onclick=home;$('#tg').onclick=()=>{S.all=!S.all;S.open.clear();renderS()};
 $('#sp').onclick=()=>{S.pi--;S.open.clear();renderS()};$('#sn').onclick=()=>{S.pi++;S.open.clear();renderS()};
 app.querySelectorAll('.pin').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;S.open.has(n)?S.open.delete(n):S.open.add(n);renderS()})}
/* ---------- boot ---------- */
fetch('data.json').then(r=>r.json()).then(j=>{DATA=j;home()}).catch(()=>{app.innerHTML='<p class="note">تعذّر تحميل data.json — افتح الموقع عبر GitHub Pages أو خادم محلي.</p>'});
</script>
</body>
</html>
